[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanokvmgo-mcp"
version = "0.1.0"
description = "Community stdio bridge for NanoKVM Go MCP with bounded phone control and local macOS OCR"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "newtype-01 and contributors"}]
dependencies = ["Pillow>=10,<13"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
dev = ["build>=1.2"]

[project.scripts]
nanokvmgo-mcp = "nanokvmgo_mcp.cli:main"

[project.urls]
Source = "https://github.com/newtype-01/nanokvmgo-mcp"
Issues = "https://github.com/newtype-01/nanokvmgo-mcp/issues"

[tool.setuptools]
packages = ["nanokvmgo_mcp"]
include-package-data = false

[tool.setuptools.package-data]
nanokvmgo_mcp = ["vision_ocr.swift"]
