name: Offline tests and wheel

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    env:
      NANOKVM_API_KEY: ""
    steps:
      - name: Isolate runtime configuration
        run: echo "NANOKVM_CONFIG_DIR=$RUNNER_TEMP/nanokvmgo-test-config" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package and build frontend
        run: python -m pip install -e ".[dev]"
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Build wheel
        run: python -m build --wheel
      - name: Inspect wheel contents
        run: |
          python - <<'PY'
          import pathlib
          import zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          assert "nanokvmgo_mcp/vision_ocr.swift" in names
          assert "nanokvmgo_mcp/cli.py" in names
          assert not any(name.endswith((".cookie", ".pem", ".key", ".jpg", ".png")) for name in names)
          assert not any("api-key" in name for name in names)
          print(wheel.name)
          PY
